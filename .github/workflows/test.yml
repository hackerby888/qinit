# CI: typecheck + unit tests + a wasm build-corpus + a live deploy smoke, all against core-lite.
# - corpus: cross-repo drift catcher — compiles the fixtures (+ real QX/QEARN) to wasm against a live core
#   checkout, so a breaking change in core's qpi.h / contract macros / ABI turns this red.
# - deploy-smoke: builds the core wasm node from the branch, boots it, and runs a real on-chain deploy +
#   read + write (Get->Inc->Get=1) — catches deploy-pipeline regressions the corpus (compile-only) can't.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 6 * * *"   # daily drift probe against core
  workflow_dispatch:
    inputs:
      core_repository:
        description: "temporary owner/repo override (requires core_ref)"
        required: false
        default: ""
      core_ref:
        description: "temporary core-lite branch, tag, or commit"
        required: false
        default: ""

env:
  BUN_VERSION: "1.3.14"
  WASI_SDK_REPOSITORY: "WebAssembly/wasi-sdk"
  WASI_SDK_RELEASE_TAG: "wasi-sdk-29"
  WASI_SDK_ASSET_VERSION: "29.0"
  CLANGD_REPOSITORY: "clangd/clangd"
  CLANGD_VERSION: "20.1.0"
  QUBIC_CLI_REPOSITORY: "qubic/qubic-cli"
  QLOGGING_REPOSITORY: "qubic/qlogging"

permissions:
  contents: read

jobs:
  resolve-core:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.source.outputs.repository }}
      ref: ${{ steps.source.outputs.ref }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Select core-lite source
        id: source
        env:
          CORE_REPOSITORY: ${{ inputs.core_repository }}
          CORE_REF: ${{ inputs.core_ref }}
        run: bun run scripts/core-compat/resolve-source.ts
      - name: Resolve core-lite commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: resolved-core
      - name: Record core-lite commit
        id: commit
        shell: bash
        run: |
          sha=$(git -C resolved-core rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::core-lite = ${{ steps.source.outputs.repository }}@${{ steps.source.outputs.ref }} ($sha)"

  # Typecheck + unit tests on every host OS — qinit ships per-host process/tar/path code, so a
  # Linux-only run lets portability bugs (e.g. MSYS `tar -C` mangling) reach core's smoke undetected.
  lint-test:
    needs: resolve-core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QINIT_CORE: ${{ github.workspace }}/core
    steps:
      - uses: actions/checkout@v4
      - name: Validate install.ps1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1").Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors.Message -join [Environment]::NewLine)
          }
      - name: Preserve core source line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Checkout core-lite (${{ needs.resolve-core.outputs.sha }})
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-core.outputs.repository }}
          ref: ${{ needs.resolve-core.outputs.sha }}
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify source configuration
        run: bun run sources:check
      - run: bun install
      - name: Verify generated core ABI
        run: bun packages/core/tools/gen-wasm-abi.ts --check
      - name: Verify bundled browser snapshot
        run: bun packages/compiler/tools/gen-qpi-snapshot.ts --verify --check
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Typecheck VS Code extension
        run: bun run --cwd packages/vscode typecheck
      - name: Unit tests
        run: bun test

  # Build package distributions and verify their Node and browser entrypoints.
  node-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install
      - name: Build package distributions
        run: |
          (cd packages/core && bun run build)
          (cd packages/proto && bun run build)
          (cd packages/compiler && bun run build)
          (cd packages/engine && bun run build)
          test -f packages/compiler/dist/browser.d.ts
      - name: Smoke browser compiler bundle
        run: bun packages/compiler/tools/ci-browser-smoke.ts
      # `bun build --compile` resolves modules differently from the source tests, so wasm crypto is
      # proven in the shipped artifact here. The k12-in-build half needs core headers and self-skips.
      - name: Compiled binary guard (wasm crypto)
        run: bun run test:compiled
      - name: Import each dist under plain Node
        run: |
          node --input-type=module -e '
            import { layoutOf } from "./packages/proto/dist/index.js";
            import { buildSignedTx, deriveIdentity } from "./packages/core/dist/browser.js";
            import { QubicSimulator } from "./packages/engine/dist/index.js";
            if (layoutOf("uint64").size !== 8) throw new Error("proto codec broken");
            if (typeof buildSignedTx !== "function" || typeof deriveIdentity !== "function") throw new Error("core surface broken");
            if (typeof QubicSimulator !== "function") throw new Error("engine surface broken");
            console.log("node-dist OK: proto + core + engine import under plain node");
          '

  # Build the external Qubic CLI from source and drive the in-process engine's peer-protocol server with it.
  # The engine's cli-e2e tests are gated on QUBIC_CLI (lint-test's `bun test` skips them); this job provides the
  # binary. Linux-only — the CLI is a CMake C++ build. A breaking upstream protocol change turns this red.
  cli-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout qubic-cli
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QUBIC_CLI_REPOSITORY }}
          path: qubic-cli
          submodules: recursive
      - name: Checkout qlogging
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QLOGGING_REPOSITORY }}
          path: qlogging
      - name: Build qubic-cli
        run: |
          cmake -S qubic-cli -B qubic-cli/build -DCMAKE_BUILD_TYPE=Release
          cmake --build qubic-cli/build -j"$(nproc)"
      - name: Build qlogging
        run: |
          cmake -S qlogging -B qlogging/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_FLAGS="-Wno-error=unused-variable"
          cmake --build qlogging/build -j"$(nproc)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: CLI e2e against the in-process engine
        env:
          QUBIC_CLI: ${{ github.workspace }}/qubic-cli/build/qubic-cli
          QLOGGING: ${{ github.workspace }}/qlogging/build/qlogging
        run: bun test packages/engine/tests/integration/cli-e2e.test.ts packages/engine/tests/logging/qlogging-integration.test.ts

  # contractverify every fixtures/*.h against the qpi.h protocol rules (the AST checker, not just a wasm
  # compile). The script self-fetches the cached verify tool; a fixture that drifts out of compliance reds it.
  verify-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: contractverify fixtures
        run: bun run scripts/contractverify/verify-fixtures.ts

  corpus:
    needs: resolve-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout core-lite (${{ needs.resolve-core.outputs.sha }})
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-core.outputs.repository }}
          ref: ${{ needs.resolve-core.outputs.sha }}
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install

      - name: Install native ABI compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18

      - name: Protocol drift guard (qinit constants vs core)
        env:
          QINIT_CORE: ${{ github.workspace }}/core
        run: bun run scripts/core-compat/check-protocol-drift.ts

      - name: Native IDL ABI
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          QINIT_NATIVE_CLANG: clang++-18
        run: bun run check:idl:native

      # The QPI extension's Tier-A linter must raise 0 warning/error findings on the real deployed
      # contracts (they're valid QPI) — a regression guard against linter false positives.
      - name: QPI linter false-positive gate (real contracts)
        env:
          QINIT_CORE: ${{ github.workspace }}/core
        run: bun run packages/vscode/scripts/lint-corpus.ts

      - name: Cache wasi-sdk
        id: wasisdk
        uses: actions/cache@v4
        with:
          path: wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-x86_64-linux
      - name: Fetch ${{ env.WASI_SDK_RELEASE_TAG }}
        if: steps.wasisdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o wasi-sdk.tar.gz \
            https://github.com/${{ env.WASI_SDK_REPOSITORY }}/releases/download/${{ env.WASI_SDK_RELEASE_TAG }}/wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-x86_64-linux.tar.gz
          mkdir -p wasi-sdk && tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1

      - name: Build corpus against core
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
          WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
        run: bun run scripts/core-compat/ci-build-corpus.ts

      - name: Light system-contract gtests (Clang runner, TS contracts)
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
          WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
        run: bun run test:sc:light

      - name: Heavy system-contract gtests (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
          WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
        run: bun run test:sc:heavy

      - name: Shared-memory system corpus (TS compiler)
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
          WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
        run: bun run scripts/core-compat/ci-qpi-shared-memory.ts

      # lint-test skips these for want of the SDK, so this is the only job that runs them.
      - name: Wasm integrations
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
          WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
        run: bun test packages/cli/tests/integration/wasm-shim-e2e.test.ts packages/cli/tests/contracts/gtest.test.ts packages/build/tests/pipeline/backend-options-parity.test.ts

  # Deterministic randomized differential gate for every public QPI container family. Each fixture is
  # compiled once by the TS compiler and native WASI, then reset between seeds. The exact TS artifact
  # is also executed unchanged by the standalone core-lite WAMR gtest.
  container-parity:
    needs: resolve-core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QINIT_CORE: ${{ github.workspace }}/core
      QINIT_CONTAINER_PARITY: "1"
      QINIT_REQUIRE_CONTAINER_TOOLCHAINS: "1"
      QINIT_CONTAINER_SEEDS: ${{ github.event_name == 'schedule' && '32' || '4' }}
      QINIT_CONTAINER_SEED_START: ${{ github.event_name == 'schedule' && github.run_number || '0' }}
      QINIT_CONTAINER_OPERATIONS: ${{ github.event_name == 'schedule' && '256' || '64' }}
      QINIT_WAMR_GTEST: ${{ github.workspace }}/core/build-container-parity/test/qubic_wasm_tests
      WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
      WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
    steps:
      - uses: actions/checkout@v4
      - name: Checkout core-lite with submodules (${{ needs.resolve-core.outputs.sha }})
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-core.outputs.repository }}
          ref: ${{ needs.resolve-core.outputs.sha }}
          path: core
          submodules: recursive

      - name: Install core-lite test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 cmake nasm ccache g++ \
            libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev \
            zlib1g-dev libzstd-dev libfmt-dev liblzo2-dev liblz4-dev libssl-dev libffi-dev
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: core-container-parity
          max-size: 2G

      - name: Build standalone WAMR core tests
        working-directory: core
        run: |
          cmake -S . -B build-container-parity -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_BINARY=OFF -DBUILD_TESTS=ON -DENABLE_AVX512=OFF -DUSE_SANITIZER=OFF \
            -DTESTNET=ON -DTESTNET_LITE_RAM=ON \
            -DLITE_WASM_SC=ON
          cmake --build build-container-parity --target qubic_wasm_tests -- -j$(nproc)
          test -x build-container-parity/test/qubic_wasm_tests

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install

      - name: Cache wasi-sdk
        id: container-wasi
        uses: actions/cache@v4
        with:
          path: wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-x86_64-linux
      - name: Fetch ${{ env.WASI_SDK_RELEASE_TAG }}
        if: steps.container-wasi.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o wasi-sdk.tar.gz \
            https://github.com/${{ env.WASI_SDK_REPOSITORY }}/releases/download/${{ env.WASI_SDK_RELEASE_TAG }}/wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-x86_64-linux.tar.gz
          mkdir -p wasi-sdk && tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1

      - name: Native differential and exact-artifact WAMR parity
        run: |
          export QINIT_CONTAINER_SEED_START=$((QINIT_CONTAINER_SEED_START * QINIT_CONTAINER_SEEDS))
          bun test \
            packages/compiler/tests/differential/container-parity.test.ts \
            packages/compiler/tests/differential/container-view-native.test.ts \
            packages/cli/tests/integration/cross-host.test.ts

  deploy-smoke:
    needs: resolve-core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout core-lite (${{ needs.resolve-core.outputs.sha }})
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-core.outputs.repository }}
          ref: ${{ needs.resolve-core.outputs.sha }}
          path: core

      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 cmake nasm ccache g++ \
            libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev \
            zlib1g-dev libzstd-dev libfmt-dev liblzo2-dev liblz4-dev libssl-dev libffi-dev
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: core-node-wasm
          max-size: 2G

      # Deploy-ready node: TESTNET + LITE_RAM + PREFILL + wasm engine + tx-status addon, real (committed,
      # public testnet) private_settings via ONLY_LOGGING=OFF. RAM-only (NO_USE_SWAP) fits the free runner.
      - name: Build wasm node
        working-directory: core
        run: |
          cmake -S . -B build-node -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_BINARY=ON -DBUILD_TESTS=OFF -DENABLE_AVX512=OFF -DUSE_SANITIZER=OFF \
            -DTESTNET=ON -DTESTNET_LITE_RAM=ON -DTESTNET_PREFILL_QUS=ON \
            -DLITE_WASM_SC=ON -DCMAKE_NO_USE_SWAP=ON -DADDON_TX_STATUS_REQUEST=ON -DONLY_LOGGING=OFF
          cmake --build build-node --target Qubic -- -j$(nproc)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install

      - name: Cache wasi-sdk
        id: wasisdk
        uses: actions/cache@v4
        with:
          path: wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-x86_64-linux
      - name: Fetch ${{ env.WASI_SDK_RELEASE_TAG }}
        if: steps.wasisdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o wasi-sdk.tar.gz \
            https://github.com/${{ env.WASI_SDK_REPOSITORY }}/releases/download/${{ env.WASI_SDK_RELEASE_TAG }}/wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-x86_64-linux.tar.gz
          mkdir -p wasi-sdk && tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1

      - name: Boot node + deploy smoke
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          QINIT_RPC: http://127.0.0.1:41841
          QINIT_NESTED_RECOVERY_RUNS: ${{ github.event_name == 'schedule' && '5' || '1' }}
          WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
          WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
        run: |
          node_pid=""
          active_run_dir=""
          stop_node() {
            if [ -n "$node_pid" ]; then
              kill "$node_pid" 2>/dev/null || true
              wait "$node_pid" 2>/dev/null || true
              node_pid=""
            fi
          }
          start_node() {
            active_run_dir="$1"
            mkdir -p "$active_run_dir"
            (
              cd "$active_run_dir"
              exec "$GITHUB_WORKSPACE/core/build-node/src/Qubic" \
                --peers 127.0.0.1 --node-mode 3 --ticking-delay 1000 > node.log 2>&1
            ) &
            node_pid=$!
            if t=$(bash scripts/live-node/poll-node-json.sh "$QINIT_RPC/live/v1/tick-info" '.tickInfo.tick // .tick // 0' 50 3); then
              echo "node ticking at $t"
            else
              echo "node never ticked"
              tail -40 "$active_run_dir/node.log"
              return 1
            fi
          }
          trap stop_node EXIT

          # Basic deploy coverage fits in three dynamic slots.
          start_node run-basic
          set +e
          bun run scripts/live-node/ci-deploy-smoke.ts; c1=$?
          bun run scripts/live-node/gauntlet-smoke.ts;  c2=$?   # QPI edge-case gauntlet (div/mod, wrap, K12, HashMap, ...)
          set -e
          stop_node
          echo "=== run-basic/node.log tail ==="; tail -25 run-basic/node.log

          # The full TS/Clang x virtual/core matrix owns all four slots.
          start_node run-matrix
          set +e
          bun run scripts/live-node/ci-qpi-dual-engine.ts; c3=$?
          set -e
          stop_node
          echo "=== run-matrix/node.log tail ==="; tail -25 run-matrix/node.log

          # Use fresh state so these independent fixtures do not fail from slot exhaustion.
          start_node run-dual
          set +e
          bun run scripts/live-node/ci-logging-dual-engine.ts; c4=$? # one TS artifact, byte-identical LOG_* payloads in the simulator and production WAMR
          bun run scripts/live-node/ci-random-dual-engine.ts; c5=$? # chain-seeded PRNG vectors, exact artifact and state in the simulator and WAMR
          set -e
          stop_node
          echo "=== run-dual/node.log tail ==="; tail -25 run-dual/node.log
          [ $c1 -eq 0 ] && [ $c2 -eq 0 ] && [ $c3 -eq 0 ] && [ $c4 -eq 0 ] && [ $c5 -eq 0 ]

  # QPI VS Code extension checks that need clangd or a real editor.
  vscode-clangd-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wasi_platform: x86_64-linux
            clangd_platform: linux
          - os: macos-latest          # Apple Silicon runner
            wasi_platform: arm64-macos
            clangd_platform: mac
            advisory: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory || false }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned core
        id: core
        shell: bash
        run: |
          echo "repository=$(jq -r .coreLite.repository config/repositories.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .coreCommit packages/compiler/core-snapshot.json)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned core-lite
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.commit }}
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Cache wasi-sdk
        id: wasisdk
        uses: actions/cache@v4
        with:
          path: wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-${{ matrix.wasi_platform }}
      - name: Fetch ${{ env.WASI_SDK_RELEASE_TAG }}
        if: steps.wasisdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o wasi-sdk.tar.gz \
            https://github.com/${{ env.WASI_SDK_REPOSITORY }}/releases/download/${{ env.WASI_SDK_RELEASE_TAG }}/wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-${{ matrix.wasi_platform }}.tar.gz
          mkdir -p wasi-sdk && tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
      - name: Install clangd ${{ env.CLANGD_VERSION }}
        run: |
          curl -fsSL -o clangd.zip \
            https://github.com/${{ env.CLANGD_REPOSITORY }}/releases/download/${{ env.CLANGD_VERSION }}/clangd-${{ matrix.clangd_platform }}-${{ env.CLANGD_VERSION }}.zip
          unzip -q clangd.zip
          echo "${{ github.workspace }}/clangd_${{ env.CLANGD_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Clear quarantine on the macOS clangd binary
        if: runner.os == 'macOS'
        run: xattr -dr com.apple.quarantine "clangd_${{ env.CLANGD_VERSION }}" || true
      - name: Prepare bundled headers
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
          WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
        run: bun run --filter qpi-vscode prepare:headers
      - name: clangd enablement gate (clangd --check on the generated DB)
        run: bun run packages/vscode/scripts/clangd-gate.ts
      - name: clangd completion probe (public API completes; no cross-scope flood)
        run: bun run packages/vscode/scripts/clangd-complete.ts

  vscode-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned core
        id: core
        run: |
          echo "repository=$(jq -r .coreLite.repository config/repositories.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .coreCommit packages/compiler/core-snapshot.json)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned core-lite
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.commit }}
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Cache wasi-sdk
        id: wasisdk
        uses: actions/cache@v4
        with:
          path: wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-x86_64-linux
      - name: Fetch ${{ env.WASI_SDK_RELEASE_TAG }}
        if: steps.wasisdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o wasi-sdk.tar.gz \
            https://github.com/${{ env.WASI_SDK_REPOSITORY }}/releases/download/${{ env.WASI_SDK_RELEASE_TAG }}/wasi-sdk-${{ env.WASI_SDK_ASSET_VERSION }}-x86_64-linux.tar.gz
          mkdir -p wasi-sdk
          tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
      - name: Prepare bundled headers
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
          WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
        run: bun run --filter qpi-vscode prepare:headers
      - name: Install clangd ${{ env.CLANGD_VERSION }}
        run: |
          curl -fsSL -o clangd.zip \
            https://github.com/${{ env.CLANGD_REPOSITORY }}/releases/download/${{ env.CLANGD_VERSION }}/clangd-linux-${{ env.CLANGD_VERSION }}.zip
          unzip -q clangd.zip
          echo "${{ github.workspace }}/clangd_${{ env.CLANGD_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Install xvfb (headless display for VS Code)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Integration tests (headless VS Code)
        env:
          # The member-completion clang fallback pairs clang with the sysroot it was shipped with.
          WASM_CLANG: ${{ github.workspace }}/wasi-sdk/bin/clang++
          WASI_SYSROOT: ${{ github.workspace }}/wasi-sdk/share/wasi-sysroot
        run: xvfb-run -a bun run --filter qpi-vscode test:int
