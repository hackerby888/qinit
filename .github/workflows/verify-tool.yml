name: contractverify tool

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when the latest upstream release is already published"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/verify-tool.yml"
      - "config/toolchains.json"
      - "scripts/contractverify/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-tool.yml"
      - "config/toolchains.json"
      - "scripts/contractverify/**"

permissions:
  contents: read

concurrency:
  group: contractverify-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: verify-latest

jobs:
  prepare:
    name: Resolve upstream release
    runs-on: ubuntu-24.04
    outputs:
      bun_version: ${{ steps.sources.outputs.bun_version }}
      cppparser_sha: ${{ steps.pin.outputs.cppparser_sha }}
      should_build: ${{ steps.gate.outputs.should_build }}
      upstream_sha: ${{ steps.pin.outputs.upstream_sha }}
      upstream_repository: ${{ steps.sources.outputs.upstream_repository }}
      version: ${{ steps.pin.outputs.version }}
    steps:
      - name: Check out Qinit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read configured sources
        id: sources
        run: |
          set -euo pipefail
          repository="$(
            jq -er '
              .contractVerifier.repository |
              select(test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))
            ' config/toolchains.json
          )"
          bun_version="$(jq -er '.bun.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' config/toolchains.json)"
          printf "bun_version=%s\n" "$bun_version" >> "$GITHUB_OUTPUT"
          printf "upstream_repository=%s\n" "$repository" >> "$GITHUB_OUTPUT"

      - name: Resolve latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ steps.sources.outputs.upstream_repository }}
        run: |
          set -euo pipefail
          release_tag="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq ".tag_name")"
          git check-ref-format "refs/tags/$release_tag"
          printf "tag=%s\n" "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check out upstream release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ steps.sources.outputs.upstream_repository }}
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Pin source commits
        id: pin
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          upstream_sha="$(git -C upstream rev-parse HEAD)"
          cppparser_sha="$(git -C upstream rev-parse HEAD:deps/CppParser)"
          checked_out_cppparser="$(git -C upstream/deps/CppParser rev-parse HEAD)"
          test "$checked_out_cppparser" = "$cppparser_sha"

          printf "upstream_sha=%s\n" "$upstream_sha" >> "$GITHUB_OUTPUT"
          printf "cppparser_sha=%s\n" "$cppparser_sha" >> "$GITHUB_OUTPUT"
          printf "version=%s@%s\n" "$RELEASE_TAG" "$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: gate
        env:
          FORCE_BUILD: ${{ inputs.force && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$FORCE_BUILD" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manifest_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/verify-manifest.json"
          if ! manifest="$(curl --fail --silent --show-error --location "$manifest_url")"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manifest_valid=true
          if ! jq -e --arg version "$VERSION" '
            . as $manifest |
            $manifest.version == $version and
            (
              ["linux-x64", "linux-arm64", "darwin-arm64", "darwin-x64", "windows-x64"] |
              all(
                . as $key |
                $manifest.assets[$key] as $asset |
                ($asset.url | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
                (($asset.sha256 // "") | test("^[0-9a-f]{64}$")) and
                ($asset.url | contains($asset.sha256))
              )
            )
          ' <<< "$manifest" >/dev/null; then
            manifest_valid=false
          fi

          if [[ "$manifest_valid" == "true" ]]; then
            if ! release_assets="$(
              gh release view "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq ".assets[].name"
            )"; then
              manifest_valid=false
            else
              while IFS= read -r asset_name; do
                if ! grep -Fxq "$asset_name" <<< "$release_assets"; then
                  manifest_valid=false
                  break
                fi
              done < <(jq -r ".assets[].url" <<< "$manifest" | sort -u)
            fi
          fi

          if [[ "$manifest_valid" == "true" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "contractverify $VERSION is already published for all supported platforms"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            architecture: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out Qinit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out pinned upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.prepare.outputs.upstream_repository }}
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: upstream
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Assert source pins
        env:
          EXPECTED_CPPPARSER_SHA: ${{ needs.prepare.outputs.cppparser_sha }}
          EXPECTED_UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$EXPECTED_UPSTREAM_SHA"
          test "$(git -C upstream/deps/CppParser rev-parse HEAD)" = "$EXPECTED_CPPPARSER_SHA"

      - name: Build and test
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          OUTPUT_NAME: contractverify-${{ matrix.platform }}
        run: |
          scripts/contractverify/build-linux.sh \
            "$GITHUB_WORKSPACE/upstream" \
            "$GITHUB_WORKSPACE/$OUTPUT_NAME" \
            "$ARCHITECTURE"

      - name: Set up Bun
        if: matrix.platform == 'linux-x64'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ needs.prepare.outputs.bun_version }}

      - name: Test Qinit contract fixtures
        if: matrix.platform == 'linux-x64'
        env:
          QINIT_NO_UPDATE: "1"
          QINIT_VERIFY: ${{ github.workspace }}/contractverify-linux-x64
        run: |
          bun install
          bun scripts/contractverify/verify-fixtures.ts

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contractverify-${{ matrix.platform }}
          path: contractverify-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3

  macos:
    name: Build macOS universal2
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-15
    steps:
      - name: Check out Qinit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out pinned upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.prepare.outputs.upstream_repository }}
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: upstream
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Assert source pins
        env:
          EXPECTED_CPPPARSER_SHA: ${{ needs.prepare.outputs.cppparser_sha }}
          EXPECTED_UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$EXPECTED_UPSTREAM_SHA"
          test "$(git -C upstream/deps/CppParser rev-parse HEAD)" = "$EXPECTED_CPPPARSER_SHA"

      - name: Install flex
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install flex

      - name: Build and test arm64 slice
        run: |
          scripts/contractverify/build-macos.sh \
            "$GITHUB_WORKSPACE/upstream" \
            "$GITHUB_WORKSPACE/contractverify-darwin-universal2"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contractverify-darwin-universal2
          path: contractverify-darwin-universal2
          if-no-files-found: error
          retention-days: 3

  macos-intel:
    name: Test macOS x64 slice
    needs:
      - prepare
      - macos
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-15-intel
    steps:
      - name: Check out Qinit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out pinned upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.prepare.outputs.upstream_repository }}
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: upstream
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Assert source pins
        env:
          EXPECTED_CPPPARSER_SHA: ${{ needs.prepare.outputs.cppparser_sha }}
          EXPECTED_UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$EXPECTED_UPSTREAM_SHA"
          test "$(git -C upstream/deps/CppParser rev-parse HEAD)" = "$EXPECTED_CPPPARSER_SHA"

      - name: Download universal binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contractverify-darwin-universal2
          path: dist

      - name: Test x64 slice
        run: |
          chmod +x dist/contractverify-darwin-universal2
          scripts/contractverify/test-macos-intel.sh \
            "$GITHUB_WORKSPACE/upstream" \
            "$GITHUB_WORKSPACE/dist/contractverify-darwin-universal2"

  windows:
    name: Build Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out Qinit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out pinned upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.prepare.outputs.upstream_repository }}
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: upstream
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Assert source pins
        shell: pwsh
        env:
          EXPECTED_CPPPARSER_SHA: ${{ needs.prepare.outputs.cppparser_sha }}
          EXPECTED_UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          $upstreamSha = (& git -C upstream rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $upstreamSha -ne $env:EXPECTED_UPSTREAM_SHA) {
            throw "upstream checkout does not match the resolved commit"
          }

          $cppparserSha = (& git -C upstream/deps/CppParser rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $cppparserSha -ne $env:EXPECTED_CPPPARSER_SHA) {
            throw "CppParser checkout does not match the resolved commit"
          }

      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/contractverify/build-windows.ps1 `
            -SourceDir "$env:GITHUB_WORKSPACE/upstream" `
            -OutputPath "$env:GITHUB_WORKSPACE/contractverify-windows-x64.exe"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contractverify-windows-x64
          path: contractverify-windows-x64.exe
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish complete verifier set
    needs:
      - prepare
      - linux
      - macos
      - macos-intel
      - windows
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Replace assets on the moving verifier release.
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: contractverify-*
          merge-multiple: true

      - name: Build complete manifest
        run: |
          set -euo pipefail
          expected=(
            contractverify-linux-x64
            contractverify-linux-arm64
            contractverify-darwin-universal2
            contractverify-windows-x64.exe
          )
          for binary in "${expected[@]}"; do
            test -f "dist/$binary"
          done

          linux_x64_sha="$(sha256sum dist/contractverify-linux-x64 | cut -d " " -f 1)"
          linux_arm64_sha="$(sha256sum dist/contractverify-linux-arm64 | cut -d " " -f 1)"
          darwin_sha="$(sha256sum dist/contractverify-darwin-universal2 | cut -d " " -f 1)"
          windows_sha="$(sha256sum dist/contractverify-windows-x64.exe | cut -d " " -f 1)"

          linux_x64_asset="contractverify-linux-x64-$linux_x64_sha"
          linux_arm64_asset="contractverify-linux-arm64-$linux_arm64_sha"
          darwin_asset="contractverify-darwin-universal2-$darwin_sha"
          windows_asset="contractverify-windows-x64-$windows_sha.exe"
          mv dist/contractverify-linux-x64 "dist/$linux_x64_asset"
          mv dist/contractverify-linux-arm64 "dist/$linux_arm64_asset"
          mv dist/contractverify-darwin-universal2 "dist/$darwin_asset"
          mv dist/contractverify-windows-x64.exe "dist/$windows_asset"

          jq -n \
            --arg version "$VERSION" \
            --arg linux_x64_asset "$linux_x64_asset" \
            --arg linux_x64_sha "$linux_x64_sha" \
            --arg linux_arm64_asset "$linux_arm64_asset" \
            --arg linux_arm64_sha "$linux_arm64_sha" \
            --arg darwin_asset "$darwin_asset" \
            --arg darwin_sha "$darwin_sha" \
            --arg windows_asset "$windows_asset" \
            --arg windows_sha "$windows_sha" \
            '{
              version: $version,
              assets: {
                "linux-x64": {
                  url: $linux_x64_asset,
                  sha256: $linux_x64_sha
                },
                "linux-arm64": {
                  url: $linux_arm64_asset,
                  sha256: $linux_arm64_sha
                },
                "darwin-arm64": {
                  url: $darwin_asset,
                  sha256: $darwin_sha
                },
                "darwin-x64": {
                  url: $darwin_asset,
                  sha256: $darwin_sha
                },
                "windows-x64": {
                  url: $windows_asset,
                  sha256: $windows_sha
                }
              }
            }' > dist/verify-manifest.json

          jq -e '
            . as $manifest |
            (
              $manifest.assets | keys ==
              ["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64", "windows-x64"]
            ) and
            (
              $manifest.assets |
              all(
                .[];
                . as $asset |
                ($asset.url | test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
                ($asset.sha256 | test("^[0-9a-f]{64}$")) and
                ($asset.url | contains($asset.sha256))
              )
            )
          ' dist/verify-manifest.json >/dev/null
          cat dist/verify-manifest.json

      - name: Publish binaries, then manifest
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "contractverify native binaries" \
              --notes "Standalone native builds of the latest stable upstream contractverify release." \
              --latest=false
          fi

          existing_assets="$(
            gh release view "$TAG" --json assets --jq ".assets[].name"
          )"
          while IFS= read -r asset_name; do
            test -f "dist/$asset_name"
            if grep -Fxq "$asset_name" <<< "$existing_assets"; then
              echo "Reusing $asset_name"
            else
              gh release upload "$TAG" "dist/$asset_name"
            fi
          done < <(
            jq -r "[.assets[].url] | unique[]" \
              dist/verify-manifest.json
          )

          gh release upload "$TAG" dist/verify-manifest.json --clobber
          gh release edit "$TAG" --latest=false
